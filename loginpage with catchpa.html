<!DOCTYPE html>
<html>
<head>
<title>Login Page</title>

<style>
body{
    font-family: Arial;
    background-color: lightblue;
}

table{
    margin: auto;
    margin-top: 100px;
    background-color: white;
    border: 1px solid black;
    padding: 15px;
}

td{
    padding: 8px;
}

input{
    padding: 5px;
}

button{
    padding: 5px;
    background-color: blue;
    color: white;
}

.captcha{
    text-align: center;
    font-weight: bold;
    background-color: lightgray;
}
</style>

</head>

<body>

<form>

<table>

<tr>
<th colspan="2">Login Page</th>
</tr>

<tr>
<td>Username</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Password</td>
<td><input type="password"></td>
</tr>

<tr>
<td>Captcha</td>
<td class="captcha">X7P4K</td>
</tr>

<tr>
<td>Enter Captcha</td>
<td><input type="text"></td>
</tr>

<tr>
<td colspan="2" align="center">
<button>Login</button>
</td>
</tr>

</table>

</form>

</body>
</html>
